<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Hệ Thống</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            max-width: 440px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 25px;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: #ffffff;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .input-box input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-box input:focus {
            border-color: #3b82f6;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .terms a {
            color: #3b82f6;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-submit:hover {
            background: #2563eb;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }

        .auth-footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <a href="/" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Về trang chủ
        </a>

        <div class="auth-header">
            <h1>Tạo Tài Khoản</h1>
            <p>Tham gia ngay để trải nghiệm đầy đủ các tính năng</p>
        </div>
{% if messages %}
    <div style="color: #fca5a5; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 14px;">
        {% for message in messages %}
            {{ message }}<br>
        {% endfor %}
    </div>
{% endif %}
        <!-- THAY ĐỔI QUAN TRỌNG: Form dùng method="POST" và thêm CSRF Token -->
        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <div class="input-box">
                    <i class="fa-regular fa-user"></i>
                    <!-- THÊM name="username" ĐỂ KHỚP VỚI VIEWS.PY -->
                    <input type="text" name="username" placeholder="Nhập tên đăng nhập (ví dụ: nguyenvanA)" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email của bạn</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <!-- THÊM name="email" -->
                    <input type="email" name="email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <!-- THÊM name="password" ĐỂ KHỚP VỚI VIEWS.PY -->
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="terms">
                <input type="checkbox" required> Tôi đồng ý với <a href="/products">Điều khoản dịch vụ</a>
            </div>

            <button type="submit" class="btn-submit">Đăng Ký</button>
        </form>

        <div class="auth-footer">
            Đã có tài khoản? <a href="/login">Đăng nhập</a>
        </div>
    </div>

</body>
</html>
