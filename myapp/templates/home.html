<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - NCP Music Distribution</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: #3b82f6;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-outline {
            background: transparent;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        /* Hero Section */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero h1 span {
            color: #3b82f6;
        }

        .hero p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .hero-actions {
            display: flex;
            gap: 15px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 600px) {
            header { padding: 15px 20px; }
            .hero h1 { font-size: 32px; }
            .hero-actions { flex-direction: column; width: 100%; }
            .hero-actions a { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Thanh điều hướng -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-cube"></i> NCP Corporation
        </div>
        <div class="nav-links">
            <a href="login.html" class="btn btn-outline">Đăng Nhập</a>
            <a href="register.html" class="btn btn-primary">Đăng Ký</a>
        </div>
    </header>

    <!-- Phần chính -->
    <div class="hero">
        <h1>Nền tảng hiện đại giúp bạn <span>tự phát hành âm nhạc của mình</span></h1>
        <p>Khám phá các giải pháp tối ưu, riêng tư và hiện đại cho nghệ sĩ.</p>
        <div class="hero-actions">
            <a href="register" class="btn btn-primary" style="padding: 14px 28px; font-size: 16px;">Bắt Đầu Ngay</a>
            <a href="login" class="btn btn-outline" style="padding: 14px 28px; font-size: 16px;">Khám Phá Thêm</a>
        </div>
    </div>

    <!-- Chân trang -->
    <footer>
        &copy; 2026 NCP Corporation. All rights reserved.
	</footer>

</body>
</html>
