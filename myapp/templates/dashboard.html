<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống đang bảo trì</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800/80 backdrop-blur-md border border-slate-700/50 rounded-2xl shadow-2xl p-8 text-center relative overflow-hidden">
        
        <!-- Hiệu ứng trang trí nền mờ -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl"></div>

        <!-- Icon bảo trì -->
        <div class="w-20 h-20 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-6 border border-indigo-500/20 shadow-inner">
            <i class="fa-solid fa-screwdriver-wrench text-3xl animate-bounce"></i>
        </div>

        <!-- Tiêu đề -->
        <h1 class="text-2xl font-bold tracking-tight mb-3">Website Đang Bảo Trì</h1>
        
        <!-- Nội dung thông báo -->
        <p class="text-slate-400 text-sm leading-relaxed mb-6">
            Chúng tôi đang tiến hành nâng cấp hệ thống để mang lại trải nghiệm tốt hơn. Rất xin lỗi vì sự bất tiện này và mong quý khách quay lại sau ít năm nữa.
        </p>

        <!-- Đồng hồ đếm ngược -->
        <div class="grid grid-cols-3 gap-3 mb-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700/40">
            <div>
                <span id="hours" class="text-xl font-bold text-indigo-400">05</span>
                <span class="block text-xs text-slate-500 uppercase tracking-wider mt-1">Năm</span>
            </div>
            <div>
                <span id="minutes" class="text-xl font-bold text-indigo-400">4</span>
                <span class="block text-xs text-slate-500 uppercase tracking-wider mt-1">Tháng</span>
            </div>
            <div>
                <span id="seconds" class="text-xl font-bold text-indigo-400">30</span>
                <span class="block text-xs text-slate-500 uppercase tracking-wider mt-1">Ngày</span>
            </div>
        </div>

        <!-- Liên hệ / Hỗ trợ -->
        <div class="pt-4 border-t border-slate-700/50 text-xs text-slate-500">
            Cần hỗ trợ khẩn cấp? Liên hệ qua email: 
            <a href="mailto:support@ncp.vn" class="text-indigo-400 hover:underline font-medium">support@ncp.vn</a>
        </div>
    </div>

 
</html>
