        <!-- Tiêu đề -->
        <h1 class="text-2xl font-bold tracking-tight mb-3">Website Đang Bảo Trì</h1>

        <p class="text-slate-400 text-sm leading-relaxed mb-6">
            Chúng tôi đang tiến hành nâng cấp hệ thống để mang lại trải nghiệm tốt hơn. Rất xin lỗi vì sự bất tiện này và mong quý khách quay lại sau ít năm nữa.

                <span class="block text-xs text-slate-500 uppercase tracking-wider mt-1">Tháng</span>
            </div>
            <div>
                <span id="seconds" class="text-xl font-bold text-indigo-400">30</span>
                <span class="block text-xs text-slate-500 uppercase tracking-wider mt-1">Ngày</span>
            </div>
        </div>

        <!-- Liên hệ / Hỗ trợ -->
        <div class="pt-4 border-t border-slate-700/50 text-xs text-slate-500">
            Cần hỗ trợ khẩn cấp? Liên hệ qua email: 
            <a href="mailto:support@hostmail.vn" class="text-indigo-400 hover:underline font-medium">support@hostmail.vn</a>
        </div>
    </div>

```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website đang bảo trì</title>
    <!-- Google Fonts -->
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap)" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .maintenance-container {
            max-width: 600px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 24px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Đồng hồ đếm ngược */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        .time-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            border-radius: 12px;
            min-width: 75px;
        }

        .time-box span {
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: #3b82f6;
        }

        .time-box label {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Form đăng ký nhận thông báo */
        .notify-form {
            display: flex;
            gap: 10px;
            max-width: 450px;
            margin: 0 auto;
        }

        .notify-form input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .notify-form input:focus {
            border-color: #3b82f6;
        }

        .notify-form button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .notify-form button:hover {
            background: #2563eb;
        }

        /* Footer nhỏ */
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #64748b;
        }

        /* Responsive cho thiết bị di động */
        @media (max-width: 480px) {
            .notify-form {
                flex-direction: column;
            }
            .countdown {
                gap: 8px;
            }
            .time-box {
                min-width: 60px;
                padding: 10px 8px;
            }
            .time-box span {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <div class="icon-box">
            <i class="fa-solid fa-gears fa-spin"></i>
        </div>
        
        <h1>Hệ Thống Đang Bảo Trì</h1>
        <p>Chúng tôi đang tiến hành nâng cấp hệ thống để mang lại trải nghiệm tốt hơn. Website sẽ sớm hoạt động trở lại. Xin lỗi vì sự bất tiện này!</p>

        <!-- Đồng hồ đếm ngược (Ví dụ đếm ngược 5 tiếng nữa) -->
        <div class="countdown" id="countdown">
            <div class="time-box">
                <span id="hours">04</span>
                <label>Giờ</label>
            </div>
            <div class="time-box">
                <span id="minutes">59</span>
                <label>Phút</label>
            </div>
            <div class="time-box">
                <span id="seconds">30</span>
                <label>Giây</label>
            </div>
        </div>

        <!-- Form nhập email nhận thông báo -->
        <form class="notify-form" onsubmit="event.preventDefault(); alert('Cảm ơn bạn! Chúng tôi sẽ gửi thông báo ngay khi hệ thống mở lại.');">
            <input type="email" placeholder="Nhập email của bạn..." required>
            <button type="submit">Nhận thông báo</button>
        </form>

        <div class="footer">
            &copy; 2026 Tên Website Của Bạn. All rights reserved.
        </div>
    </div>

    <script>
        // Thiết lập thời gian đếm ngược (Ví dụ: 5 tiếng từ lúc tải trang)
        let timeInSeconds = 5 * 3600 + 45 * 60;

        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        function updateCountdown() {
            if (timeInSeconds <= 0) return;
            
            timeInSeconds--;
            
            const hours = Math.floor(timeInSeconds / 3600);
            const minutes = Math.floor((timeInSeconds % 3600) / 60);
            const seconds = timeInSeconds % 60;

            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
